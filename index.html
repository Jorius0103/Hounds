<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: retractable left rail with a data-driven menu tree + full-height content pane; maps open in a full-screen explorer. Single dark look, matching the Mesa de Combate app. */
:root {
  color-scheme: dark;
  --ground: #020617;
  --rail: #0b1222;
  --surface: #0f172a;
  --surface-2: #131c31;
  --line: #1e293b;
  --line-2: #334155;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --faint: #64748b;
  --accent: #f59e0b;
  --accent-ink: #0b1222;
  --accent-soft: rgba(245, 158, 11, .12);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, .12);
  --font-ui: "Plus Jakarta Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --rail-open: 268px;
  --rail-closed: 64px;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-ui); font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: var(--rail-open) 1fr; height: 100%; transition: grid-template-columns .2s ease; }
.app.collapsed { grid-template-columns: var(--rail-closed) 1fr; }

/* Rail */
.rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 12px; padding: 16px 14px; border-bottom: 1px solid var(--line); min-height: 64px; box-sizing: border-box; }
.brand-mark { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(245,158,11,.35); }
.brand-text { min-width: 0; white-space: nowrap; }
.brand-text strong { display: block; font-size: 16px; font-weight: 800; letter-spacing: .02em; }
.brand-text span { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.nav { padding: 12px 10px; flex: 1; overflow-y: auto; overflow-x: hidden; }
.nav-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 6px 8px 8px; white-space: nowrap; }

/* Menu tree: every level uses the same markup and rules */
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; align-items: center; border-radius: 10px; border: 1px solid transparent; }
.row:hover { background: var(--surface); }
.row.current { background: var(--accent-soft); border-color: rgba(245,158,11,.25); }
.node-row { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; box-sizing: border-box; padding: 9px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; text-align: left; text-decoration: none; white-space: nowrap; cursor: pointer; }
.node-row svg { flex: none; }
.node-row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row:hover .node-row { color: var(--text); }
.row.current .node-row { color: var(--accent); }
.node.on-path > .row .node-row { color: var(--text); }
.node-row:focus-visible, .chev-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chev-btn { flex: none; display: grid; place-items: center; width: 30px; height: 30px; margin-right: 4px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
.chev-btn:hover { color: var(--text); background: var(--surface-2); }
.chev { flex: none; transition: transform .18s ease; color: var(--muted); }
[aria-expanded="true"] > .chev, [aria-expanded="true"] .chev { transform: rotate(90deg); }
.kids { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .2s ease; }
.kids > ul { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 2px; margin-left: 20px; padding-left: 10px; border-left: 1px solid var(--line); }
.node.open > .kids { grid-template-rows: 1fr; }
.node.open > .kids > ul { padding-top: 4px; padding-bottom: 4px; }
.node:not(.depth-0) > .row .node-row { font-size: 13px; padding: 7px 10px; gap: 10px; }
.kids .kids .kids > ul { margin-left: 9px; padding-left: 5px; }
.kids .node-row { white-space: normal; }
.kids .node-row .label { white-space: normal; overflow-wrap: anywhere; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.node:not(.depth-0):not(.depth-1):not(.depth-2) > .row .node-row { padding: 6px 6px; gap: 8px; }
.empty-kid { font-size: 12px; color: var(--faint); padding: 6px 10px; font-style: italic; }

.toggle { margin: 10px; display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.toggle:hover { color: var(--text); background: var(--surface); }
.toggle:focus-visible, .menu-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle svg { flex: none; transition: transform .2s ease; }
.app.collapsed .toggle svg { transform: rotate(180deg); }
.app.collapsed .brand-text, .app.collapsed .nav-label, .app.collapsed .toggle span, .app.collapsed .node-row .label, .app.collapsed .chev, .app.collapsed .chev-btn, .app.collapsed .kids { display: none; }
.app.collapsed .brand { justify-content: center; padding-inline: 0; }
.app.collapsed .node-row, .app.collapsed .toggle { justify-content: center; }

/* Content */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.topbar { display: none; }
.view { flex: 1; min-height: 0; }
.view[hidden] { display: none !important; }
.frame { width: 100%; height: 100%; border: 0; display: block; background: var(--ground); }
.page { overflow-y: auto; height: 100%; }
.page-inner { max-width: 1040px; margin: 0 auto; padding: 28px 24px 56px; display: flex; flex-direction: column; gap: 22px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--text); text-decoration: underline; }
.crumbs b { color: var(--accent); font-weight: 600; }
.page h1 { margin: 2px 0 6px; font-size: 30px; font-weight: 800; text-wrap: balance; overflow-wrap: anywhere; }
.lede { margin: 0; color: var(--muted); line-height: 1.6; max-width: 66ch; }
.head-row { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.head-row > div { min-width: 0; }
.notice { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-2); border-radius: 10px; padding: 10px 12px; }
.sec-title { margin: 0 0 12px; font-size: 12px; font-family: var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: rgba(248,113,113,.4); background: transparent; }
.btn.danger:hover { background: var(--danger-soft); }
.btn.danger.solid { background: var(--danger); color: #1a0505; border-color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--surface-2); }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lab { font-size: 12px; font-weight: 700; color: var(--muted); }
.field input[type=text], .field textarea, .field select { background: #0b1222; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 14px; width: 100%; box-sizing: border-box; }
.field textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.field .err { font-size: 12px; color: var(--danger); min-height: 0; }
.field.invalid input, .field.invalid .drop { border-color: var(--danger); }

/* Maps grid */
.maps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.map-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; text-decoration: none; color: inherit; transition: border-color .15s ease, transform .15s ease; }
.map-card:hover { border-color: var(--line-2); transform: translateY(-2px); }
.map-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.thumb { aspect-ratio: 4 / 3; max-width: 100%; background: #0b1222; border-bottom: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; color: var(--faint); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.map-card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.map-card-body strong { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { font-family: var(--font-mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.empty-state { border: 1px dashed var(--line-2); border-radius: 14px; padding: 40px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--muted); }
.empty-state strong { color: var(--text); font-size: 16px; }

/* Single map page */
.preview { background: #0b1222; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; place-items: center; max-height: 62vh; min-height: 200px; }
.preview img { max-width: 100%; max-height: 62vh; width: auto; height: auto; display: block; }
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 360px; overflow-y: auto; }
.mk-item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px; border-radius: 9px; border: 1px solid transparent; background: transparent; cursor: pointer; min-width: 0; }
.mk-item:hover { background: var(--surface-2); }
.mk-item.sel { border-color: rgba(245,158,11,.4); background: var(--accent-soft); }
.mk-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mk-item .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mk-item .t b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mk-item .t span { font-size: 11px; color: var(--faint); }
.dot { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #0b1222; }
.confirm { border: 1px solid rgba(248,113,113,.4); background: var(--danger-soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }

/* Modal */
.modal-back { position: fixed; inset: 0; background: rgba(2,6,23,.72); z-index: 60; display: grid; place-items: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.modal-back[hidden] { display: none; }
.modal { width: 100%; max-width: 520px; max-height: calc(100% - 8px); overflow-y: auto; background: var(--rail); border: 1px solid var(--line-2); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; }
.modal h2 { margin: 0; font-size: 19px; }
.drop { border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--muted); cursor: pointer; background: #0b1222; }
.drop:hover, .drop.over { border-color: var(--accent); color: var(--text); }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop small { color: var(--faint); }
.pv { background: #0b1222; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; place-items: center; }
.pv img { max-width: 100%; max-height: 240px; display: block; }
.pv-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--faint); padding: 8px 10px; border-top: 1px solid var(--line); width: 100%; box-sizing: border-box; }
.pv-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.form-err { font-size: 13px; color: var(--danger); }

/* Explorer */
.explorer { position: fixed; inset: 0; z-index: 50; background: #01040d; display: flex; flex-direction: column; }
.explorer[hidden] { display: none; }
.ex-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: rgba(11,18,34,.92); border-bottom: 1px solid var(--line); flex-wrap: wrap; z-index: 3; }
.ex-title { font-weight: 800; font-size: 15px; flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-zoom { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
.ex-zoom button { border: 0; background: var(--surface); width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; color: var(--text); }
.ex-zoom button:hover { background: var(--surface-2); }
.ex-zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ex-zoom output { min-width: 52px; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; background: var(--surface); line-height: 34px; border-inline: 1px solid var(--line-2); }
.ex-body { flex: 1; min-height: 0; position: relative; display: flex; }
.viewport { position: relative; flex: 1; min-width: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; background:
  repeating-linear-gradient(0deg, transparent 0 31px, rgba(148,163,184,.05) 31px 32px),
  repeating-linear-gradient(90deg, transparent 0 31px, rgba(148,163,184,.05) 31px 32px), #01040d; }
.viewport.dragging { cursor: grabbing; }
.viewport.placing { cursor: crosshair; }
.viewport:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.stage img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
.pin { position: absolute; width: 0; height: 0; border: 0; padding: 0; background: none; cursor: pointer; }
.pin-in { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%) scale(var(--inv, 1)); transform-origin: 50% 100%; display: flex; flex-direction: column; align-items: center; pointer-events: auto; }
.pin-head { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #0b1222; border: 2px solid #0b1222; box-shadow: 0 2px 8px rgba(0,0,0,.6); }
.pin-tip { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 9px solid #0b1222; margin-top: -3px; }
.pin-label { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: rgba(11,18,34,.95); border: 1px solid var(--line-2); color: var(--text); font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 7px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s ease; }
.pin:hover .pin-label, .pin:focus-visible .pin-label, .pin.sel .pin-label, .show-labels .pin-label { opacity: 1; }
.pin:focus-visible .pin-head { outline: 2px solid #fff; outline-offset: 2px; }
.pin.sel .pin-head { box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 2px 10px rgba(0,0,0,.6); }
.pin.draft .pin-head { animation: bob 1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.hint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(11,18,34,.95); border: 1px solid rgba(245,158,11,.5); color: var(--text); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 2; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.hint[hidden] { display: none; }
.panel { width: 340px; flex: none; background: var(--rail); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; z-index: 3; }
.panel[hidden] { display: none; }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.panel-head h3 { margin: 0; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-body { padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.icon-btn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; flex: none; }
.icon-btn:hover { color: var(--text); background: var(--surface); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cat-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px 3px 4px; border-radius: 999px; background: #0b1222; border: 1px solid var(--line); color: var(--muted); align-self: flex-start; }
.cat-chip i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; color: #0b1222; }
.desc { margin: 0; color: var(--text); line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.desc.none { color: var(--faint); font-style: italic; }
.coords { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.cat-opt { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 9px; border: 1px solid var(--line); background: #0b1222; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
.cat-opt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.cat-opt:has(input:checked) { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
.cat-opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
.cat-opt i { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #0b1222; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filter { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px 4px 5px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--muted); cursor: pointer; }
.filter i { width: 14px; height: 14px; border-radius: 50%; }
.filter[aria-pressed="false"] { opacity: .45; }
.filter:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.search { width: 100%; box-sizing: border-box; background: #0b1222; border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; color: var(--text); font-size: 14px; }
.search:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text); padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 80; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.5); }
.toast.bad { border-color: rgba(248,113,113,.5); }
.toast[hidden] { display: none; }

/* Phone */
@media (max-width: 760px) {
  .app, .app.collapsed { grid-template-columns: 1fr; }
  .rail { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 20; transform: translateX(-100%); transition: transform .2s ease; padding-top: env(safe-area-inset-top, 0px); }
  .app.drawer .rail { transform: none; }
  .app.collapsed .brand-text, .app.collapsed .nav-label { display: block; }
  .app.collapsed .node-row .label { display: block; }
  .app.collapsed .chev, .app.collapsed .chev-btn { display: grid; }

  function closeModal(force) {

  var ACCEPT = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];
  function imageFieldHtml(id, label, help) {
    return '<div class="field" id="f_' + id + '"><span class="lab" id="lab_' + id + '">' + esc(label) + '</span>' +
      '<label class="drop" id="drop_' + id + '"><input type="file" id="file_' + id + '" accept="' + ACCEPT.join(',') + '" aria-labelledby="lab_' + id + '">' + svg(ICON.image, 26, 1.8) +
      '<span><b>Escolher imagem</b> ou arrastar para cá</span><small>' + esc(help) + '</small></label>' +
      '<div class="pv" id="pv_' + id + '" hidden><img id="pvimg_' + id + '" alt="Pré-visualização"><div class="pv-meta"><span id="pvname_' + id + '"></span><span id="pvdims_' + id + '"></span></div></div>' +
      '<div class="btn-row" id="pvact_' + id + '" hidden><button class="btn ghost" type="button" id="pvrm_' + id + '">' + svg(ICON.trash, 14) + 'Remover imagem</button></div>' +
      '<div class="err" id="err_' + id + '"></div></div>';
  }
  // Wires an image field; `existing` is {url, name, dims} for an image already saved.
  function imageField(id, opts) {
    var st = { file: null, dims: null, url: null, removed: false };
    var drop = $('drop_' + id), input = $('file_' + id);
    function err(t) { $('err_' + id).textContent = t || ''; $('f_' + id).classList.toggle('invalid', !!t); }
    function show(url, name, dims) {
      $('pvimg_' + id).src = url; $('pvname_' + id).textContent = name || ''; $('pvdims_' + id).textContent = dims || '';
      $('pv_' + id).hidden = false; if (opts.removable) $('pvact_' + id).hidden = false;
    }
    function clear() { $('pv_' + id).hidden = true; $('pvact_' + id).hidden = true; $('pvimg_' + id).removeAttribute('src'); }
    function setFile(f) {
      if (st.url) { URL.revokeObjectURL(st.url); st.url = null; }
      st.file = null; st.dims = null;
      if (!f) return;
      if (ACCEPT.indexOf(f.type) < 0) { err('Esse formato não é aceito. Use PNG, JPG, WebP ou GIF.'); return; }
      if (f.size > 20 * 1024 * 1024) { err('A imagem passa de 20 MB. Reduza o arquivo e tente de novo.'); return; }
      var url = URL.createObjectURL(f), img = new Image();
      img.onload = function () {
        st.file = f; st.url = url; st.dims = { w: img.naturalWidth, h: img.naturalHeight }; st.removed = false;
        show(url, f.name, st.dims.w + ' × ' + st.dims.h + ' px · ' + fmtBytes(f.size)); err('');
        if (opts.onPick) opts.onPick(f);
      };
      img.onerror = function () { URL.revokeObjectURL(url); err('Não foi possível abrir essa imagem. Tente outro arquivo.'); };
      img.src = url;
    }
    input.addEventListener('change', function () { setFile(input.files && input.files[0]); });
    ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) setFile(f); });
    var rm = $('pvrm_' + id); if (rm) rm.onclick = function () { setFile(null); st.removed = true; clear(); input.value = ''; };
    if (opts.existing) opts.existing.then(function (e) { if (e && e.url && !st.file && !st.removed) show(e.url, e.name, e.dims); });
    st.err = err; st.drop = drop;
    st.dispose = function () { if (st.url) URL.revokeObjectURL(st.url); };
    return st;
  }

  /* =====================================================================
     Mesa de Combate data on the site.
     The Mesa's own sync channel (built for MQTT) is wired to the hub: every
     SYNC_FULL it publishes is saved in the shared database, and saved state
     is loaded into the Mesa before it opens and pushed to it live.
       mesa/state          { rev, n, by, createdAt, updatedAt }
       mesa_chunks/{rev_i} { rev, i, part }   (state JSON split in pieces)
     ===================================================================== */
  var MESA_LS = { combats: 'gurps_combat_master_data_v2', conditions: 'gurps_combat_master_conditions_v2', players: 'gurps_fixed_personagens_v1' };
  var MesaSync = (function () {
    var CH = 60000, head = null, loadedRev = null, state = null, listeners = [], timer = null, pending = null, writing = false, myRev = null;
    var readyRes, ready = new Promise(function (r) { readyRes = r; }), gotHead = false;
    var cid = 'hub-' + uid();
    function localState() {
      var out = {}, any = false;
      Object.keys(MESA_LS).forEach(function (k) { try { var v = JSON.parse(localStorage.getItem(MESA_LS[k]) || 'null'); if (v != null) { out[k] = v; any = true; } } catch (e) {} });
      return any ? out : null;
    }
    function toLocal(st) {
      try {
        if (!localStorage.getItem('hounds_mesa_backup_v1')) { var b = localState(); if (b) localStorage.setItem('hounds_mesa_backup_v1', JSON.stringify({ at: Date.now(), data: b })); }
      } catch (e) {}
      Object.keys(MESA_LS).forEach(function (k) { if (st[k] != null) { try { localStorage.setItem(MESA_LS[k], JSON.stringify(st[k])); } catch (e) {} } });
    }
    function fetchRev(h) {
      return W.store.query('mesa_chunks', 'rev', h.rev).then(function (rows) {
        if (rows.length < h.n) return null;
        rows.sort(function (a, b) { return a.i - b.i; });
        try { return JSON.parse(rows.slice(0, h.n).map(function (r) { return r.part; }).join('')); } catch (e) { return null; }
      });
    }
    function onHead(rows) {
      var h0 = rows.filter(function (r) { return r.id === 'state'; })[0] || null;
      var first = !gotHead; gotHead = true;
      head = h0;
      if (!h0) { if (first) readyRes(); return; }
      if (h0.rev === loadedRev || h0.rev === myRev) { loadedRev = h0.rev; if (first) readyRes(); return; }
      var rev = h0.rev;
      fetchRev(h0).then(function (st) {
        if (!st) { if (first) readyRes(); return; }
        loadedRev = rev; state = st;
        if (first) { readyRes(); return; }
        // Someone else saved: push it into an open Mesa, or reload it fresh next time.
        if (location.hash === '#mesa' && listeners.length) {
          var msg = JSON.stringify(Object.assign({ type: 'SYNC_FULL', clientId: 'hub', timestamp: Date.now() }, st));
          listeners.slice().forEach(function (fn) { try { fn(msg); } catch (e) {} });
        } else if (window.hubMesaStale) window.hubMesaStale();
      }, function () { if (first) readyRes(); });
    }
    function canSave() {
      var u = window.hubUser; if (!u || !W.store || !canWrite()) return false;
      if (u.role === 'visualizador') return false;
      return !!head || u.role === 'mestre';
    }
    function save(st) {
      if (!canSave()) return Promise.resolve();
      var json = JSON.stringify(st), parts = [];
      for (var i = 0; i < json.length; i += CH) parts.push(json.slice(i, i + CH));
      var rev = cid + '-' + Date.now(), prev = head && head.rev, t = now();
      myRev = rev;
      var seq = Promise.resolve();
      parts.forEach(function (p, i) { seq = seq.then(function () { return W.store.put('mesa_chunks', rev + '_' + i, { rev: rev, i: i, part: p, createdAt: t }); }); });
      seq = seq.then(function () { return W.store.put('mesa', 'state', { rev: rev, n: parts.length, by: (window.hubUser && window.hubUser.id) || null, createdAt: (head && head.createdAt) || t, updatedAt: t }); });
      return seq.then(function () {
        loadedRev = rev; state = st;
        if (prev && prev !== rev) W.store.query('mesa_chunks', 'rev', prev).then(function (old) { old.forEach(function (o) { W.store.remove('mesa_chunks', o.id).catch(function () {}); }); }).catch(function () {});
      });
    }
    function flush() {
      timer = null;
      if (writing || !pending) { if (pending && !timer) timer = setTimeout(flush, 800); return; }
      var st = pending; pending = null; writing = true;
      save(st).catch(function (er) { toast('Não foi possível salvar a Mesa: ' + errorText(er), true); }).then(function () { writing = false; if (pending && !timer) timer = setTimeout(flush, 800); });
    }
    return {
      start: function () { W.store.watch('mesa', onHead, function () { if (!gotHead) { gotHead = true; readyRes(); } }); },
      // Runs before the Mesa iframe loads: put the saved state where the Mesa reads it.
      prepare: function () {
        var to = new Promise(function (r) { setTimeout(r, 5000); });
        return Promise.race([ready, to]).then(function () {
          if (state) { toLocal(state); return; }
          if (head) return;
          var loc = localState();
          if (loc && window.hubUser && window.hubUser.role === 'mestre') return save(loc).catch(function () {});
        });
      },
      publish: function (str) {
        var m; try { m = JSON.parse(str); } catch (e) { return; }
        if (!m || m.type !== 'SYNC_FULL') return;
        var st = { combats: m.combats, conditions: m.conditions, players: m.players, activeCombatId: m.activeCombatId || null };
        pending = st;
        if (!timer) timer = setTimeout(flush, 1200);
      },
      // Save now (used by the Mesa's "Sair" button) and confirm to the person.
      flushNow: function () {
        if (timer) { clearTimeout(timer); timer = null; }
        var wait = function () { return writing ? new Promise(function (r) { setTimeout(r, 250); }).then(wait) : Promise.resolve(); };
        return wait().then(function () {
          if (!pending) return 'none';
          if (!canSave()) { pending = null; return 'skip'; }
          var st = pending; pending = null; writing = true;
          return save(st).then(function () { writing = false; return 'saved'; }, function (er) { writing = false; throw er; });
        }).then(function (r) { if (r !== 'skip') toast('Combate salvo.'); }, function (er) { toast('Não foi possível salvar a Mesa: ' + errorText(er), true); });
      },
      subscribe: function (fn) { listeners.push(fn); return function () { listeners = listeners.filter(function (x) { return x !== fn; }); }; }
    };
  })();
  window.hubMesaBus = { publish: MesaSync.publish, subscribe: MesaSync.subscribe };
  window.hubMesaPrepare = function () { return MesaSync.prepare(); };
  window.hubMesaFlush = function () { return MesaSync.flushNow(); };
  window.addEventListener('beforeunload', function () { });

  function renderPage() {
    var r = S.route; if (!r) return;
    if (r.page === 'mesa' || r.page === 'home') return;
    if (!W.store) { pageRoot.innerHTML = '<p class="lede">Carregando…</p>'; return; }

    else if (r.page === 'notes') renderNotesPage();

  function onRoute() {
    var r = parseRoute();
    if (!r) r = { page: 'home', node: null };
    var prev = S.route;
    if (!prev || prev.node !== r.node) S.ui = { q: prev && prev.page === r.page ? S.ui.q : '' };
    S.route = r;

    app.classList.toggle('on-mesa', isMesa);
    if (isMesa) setCollapsed(true, true);

    document.querySelectorAll('.view').forEach(function (v) { v.hidden = r.page === 'home' || v.id !== (r.page === 'mesa' ? 'view-mesa' : 'view-page'); });
    if (byId[r.node]) { revealPath(r.node); if (r.page === 'maps' || r.page === 'locais' || r.page === 'chars' || r.page === 'notes' || r.page === 'nb') expand(r.node); }
    paintMenu();
    topTitle.textContent = byId[r.node] ? byId[r.node].label : 'Hounds';
    if (r.page !== 'home') lstore('hounds_route', r.page === 'map' ? mapHref(r.mapId) : r.page === 'local' ? locHref(r.locId) : r.page === 'char' ? charHref(r.charId) : hrefFor(r.node));
    if (!(r.page === 'map' && r.explore)) Explorer.close();
    if (prev && prev.node !== r.node) { var pg = $('view-page'); if (pg) pg.scrollTop = 0; }
    renderPage();
  }
  window.addEventListener('hashchange', onRoute);

  function onData(kind) {
    migrateVisibility();
    if (kind === 'maps') indexMaps();
    if (kind === 'locations') indexLocations();
    if (kind === 'characters') indexCharacters();
    renderMenu();
    if (!S.route) return;
    topTitle.textContent = byId[S.route.node] ? byId[S.route.node].label : topTitle.textContent;

    if (S.route.page === 'locais' && kind !== 'maps' && document.activeElement && document.activeElement.id === 'locSearch') { renderLocList(); return; }
    if (S.route.page === 'chars' && document.activeElement && document.activeElement.id === 'charSearch') { renderCharList(); return; }

  /* =====================================================================
     Start
     ===================================================================== */
  setCollapsed(lstore('hounds_rail_collapsed') === '1');

  onRoute();

  function connect() {
    var use = window.claude && typeof window.claude.use === 'function' ? function (n) { return window.claude.use(n).catch(function () { return null; }); } : function () { return Promise.resolve(null); };
    return Promise.all([use('db'), use('assets'), use('user')]).then(function (r) {

      try { return window.indexedDB ? LocalStore() : null; } catch (e) { return null; }
    });
  }
  connect().then(function (s) {
    if (!s) { W.loaded = { maps: true, locations: true, characters: true }; renderMenu(); pageRoot.innerHTML = '<p class="notice">Não foi possível acessar o armazenamento nesta visualização.</p>'; return; }
    W.store = s;
    return s.init().then(function () {
      var fail = function () { toast('Não foi possível carregar os dados.', true); };
      s.watch('maps', function (l) { W.raw.maps = l; W.maps = pub(l); W.loaded.maps = true; onData('maps'); }, fail);
      s.watch('locations', function (l) { W.raw.locations = l; W.locations = pub(l); W.loaded.locations = true; onData('locations'); }, fail);
      s.watch('characters', function (l) { W.raw.characters = l; W.characters = pub(l); W.loaded.characters = true; onData('characters'); }, fail);

<script>
(function () {
  var USERS_KEY = 'gurps_combat_master_users_v2';
  var DEFAULTS = [
    { id: 'user-leandro', name: 'Leandro', role: 'mestre' },
    { id: 'user-espectador', name: 'Espectador', role: 'visualizador' }
  ];
  var ROLE = { mestre: 'Mestre', jogador: 'Jogador', visualizador: 'Espectador' };
  var mesaHtml = null;
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ini(n) { var p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : (p[0][1] || ''))).toUpperCase(); }
  function users() {
    try { var l = JSON.parse(localStorage.getItem(USERS_KEY) || 'null'); if (Array.isArray(l) && l.length) return l; } catch (e) {}
    return DEFAULTS;
  }
  function mesaSource() {
    if (mesaHtml == null) {
      var b = atob(el('mesaSrc').textContent.trim()), u = new Uint8Array(b.length);
      for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
      mesaHtml = new TextDecoder('utf-8').decode(u);
    }
    return mesaHtml;
  }
  var mesaFor = null;
  function syncMesa() {
    if (!window.hubUser || location.hash !== '#mesa') return;
    if (mesaFor === window.hubUser.id) { try { var fw = el('mesaFrame').contentWindow; fw && fw.__mesaOpenPicker && fw.__mesaOpenPicker(); } catch (e) {} return; }
    var who = mesaFor = window.hubUser.id;
    var go = function () { if (mesaFor === who) el('mesaFrame').srcdoc = mesaSource(); };
    if (window.hubMesaPrepare) window.hubMesaPrepare().then(go, go); else go();
  }
  window.addEventListener('hashchange', syncMesa);
  function apply(u) {
    window.hubUser = u;
    document.body.setAttribute('data-role', u.role || 'jogador');
    document.body.setAttribute('data-user', u.id || '');
    el('whoAv').textContent = ini(u.name);
    el('whoName').textContent = u.name;
    el('whoRole').textContent = ROLE[u.role] || u.role || '';
    el('whoBtn').hidden = false;
    try { window.dispatchEvent(new CustomEvent('hub:user', { detail: u })); } catch (e) {}
  }
  function choose(u) {
    var changed = !window.hubUser || window.hubUser.id !== u.id;
    apply(u);
    el('gate').hidden = true;
    if (changed) mesaFor = null;
    syncMesa();
  }
  function openGate() {
    var list = (window.hubUsers && window.hubUsers()) || users();
    el('gateList').innerHTML = list.map(function (u, i) {
      var r = ROLE[u.role] ? u.role : 'jogador';
      return '<button type="button" class="gate-user" data-i="' + i + '"><span class="av">' + esc(ini(u.name)) + '</span><span class="nm">' + esc(u.name) + '</span><span class="role-tag ' + r + '">' + esc(ROLE[u.role] || u.role || 'Jogador') + '</span></button>';
    }).join('');
    el('gateList').onclick = function (ev) {
      var b = ev.target.closest('.gate-user'); if (!b) return;
      var u = list[+b.dataset.i]; if (u) choose({ id: u.id, name: u.name, role: u.role });
    };
    el('gateClose').hidden = !window.hubUser;
    el('gate').hidden = false;
    var f = el('gateList').querySelector('.gate-user'); if (f) f.focus();
  }
  el('gateClose').onclick = function () { el('gate').hidden = true; };
  el('whoBtn').onclick = openGate;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !el('gate').hidden && window.hubUser) el('gate').hidden = true; });
  window.hubSwitchUser = openGate;
  window.hubApplyUser = apply;
  window.hubMesaStale = function () { mesaFor = null; syncMesa(); };
  window.addEventListener('hub:users', function () {
    var list = window.hubUsers && window.hubUsers(); if (!list) return;
    var cur = window.hubUser;
    if (cur) {
      var u = list.filter(function (x) { return x.id === cur.id; })[0];
      if (!u) { window.hubUser = null; el('whoBtn').hidden = true; openGate(); return; }
      if (u.name !== cur.name || u.role !== cur.role) { apply(u); mesaFor = null; syncMesa(); }
    }
    if (!el('gate').hidden) openGate();
  });
  openGate();
})();
</script>
