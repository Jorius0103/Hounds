<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
/* Theme: the saved choice, otherwise the system's. Runs before the page paints. */
(function () {
  var t = null; try { t = localStorage.getItem('hounds_theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<!-- A ordem importa: cada arquivo pode sobrescrever regras dos anteriores. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/explorer.css">
<link rel="stylesheet" href="css/responsivo.css">
<link rel="stylesheet" href="css/paginas.css">
<link rel="stylesheet" href="css/editor-texto.css">
<link rel="stylesheet" href="css/mesa.css">
</head>
<body>

<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Menu">
    <a class="brand" id="brandLink" href="#inicio" title="Página inicial" aria-label="Hounds, página inicial">
      <div class="brand-mark" aria-hidden="true">
        <img src="imagens/brasao.jpg" alt="" width="256" height="256">
      </div>
      <div class="brand-text"><strong>Hounds</strong><span>Campanha GURPS</span></div>
    </a>
    <nav class="nav" aria-label="Páginas">
      <div class="nav-label">Páginas</div>
      <ul class="tree" id="menu"></ul>
    </nav>
    <button class="who" id="whoBtn" type="button" title="Trocar usuário" hidden><span class="av" id="whoAv"></span><span class="txt"><strong id="whoName"></strong><span id="whoRole"></span></span></button>
    <button class="toggle theme-btn" id="themeBtn" type="button">
      <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <span>Tema claro</span>
    </button>
    <button class="toggle" id="toggle" type="button" aria-expanded="true" aria-controls="rail">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      <span>Recolher menu</span>
    </button>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir menu" aria-controls="rail" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
      <strong id="topTitle">Mesa de Combate</strong>
    </div>

    <section class="view" id="view-mesa" aria-label="Mesa de Combate">
      <iframe class="frame" id="mesaFrame" title="Mesa de Combate"></iframe>
    </section>

    <section class="view page" id="view-page" aria-live="polite" hidden>
      <div class="page-inner" id="pageRoot"></div>
    </section>
  </main>
</div>

<div class="modal-back" id="modalBack" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<!-- Explorer -->
<div class="explorer" id="explorer" hidden>
  <div class="ex-bar">
    <button class="btn ghost" type="button" id="exClose" title="Sair da exploração">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span class="lbl">Sair</span>
    </button>
    <div class="ex-title" id="exTitle"></div>
    <button class="btn" type="button" id="exAdd" aria-pressed="false" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><path d="M12 7v6M9 10h6"/></svg><span class="lbl">Adicionar marcador</span>
    </button>
    <button class="btn" type="button" id="exList" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h.01M3 18h.01M3 6h.01M8 12h13M8 18h13M8 6h13"/></svg><span class="lbl">Marcadores</span> <span class="meta" id="exCount"></span>
    </button>
    <div class="ex-zoom" role="group" aria-label="Zoom">
      <button type="button" id="zOut" aria-label="Afastar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <output id="zVal" aria-live="polite">100%</output>
      <button type="button" id="zIn" aria-label="Aproximar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <button class="icon-btn" type="button" id="zFit" title="Ajustar à tela" aria-label="Ajustar à tela"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
  </div>
  <div class="ex-body">
    <div class="viewport" id="viewport" tabindex="0" aria-label="Mapa. Arraste para mover, use a roda do mouse ou dois dedos para zoom.">
      <div class="stage" id="stage"><img id="stageImg" alt=""><div id="pins"></div></div>
      <div class="hint" id="hint" hidden></div>
    </div>
    <aside class="panel" id="panel" hidden aria-labelledby="panelTitle">
      <div class="panel-head"><h3 id="panelTitle"></h3><button class="icon-btn" type="button" id="panelClose" aria-label="Fechar painel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<div class="gate" id="gate" hidden>
  <div class="gate-card" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <div class="gate-head">
      <div class="brand-mark" aria-hidden="true"><img src="imagens/brasao.jpg" alt="" width="256" height="256"></div>
      <h1 id="gateTitle">Hounds</h1>
      <p>Escolha seu usuário para entrar</p>
    </div>
    <div class="gate-list" id="gateList"></div>
    <button class="btn gate-close" id="gateClose" type="button" hidden>Voltar</button>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="supabase-config.js"></script>

<!--
  Scripts clássicos (sem módulos nem build). As funções e variáveis de nível
  superior de cada arquivo são globais e usadas pelos seguintes, por isso a
  ordem importa: base primeiro, depois as abas, app.js e gate.js por último.
-->
<!-- Base -->
<script src="js/utils.js"></script>
<script src="js/store/store.js"></script>
<script src="js/store/firebase.js"></script>
<script src="js/store/supabase.js"></script>
<script src="js/mundo.js"></script>
<script src="js/rotas.js"></script>
<script src="js/menu.js"></script>
<script src="js/pagina.js"></script>
<script src="js/modal.js"></script>
<!-- Abas -->
<script src="js/tabs/tab-mapas.js"></script>
<script src="js/tabs/tab-locais.js"></script>
<script src="js/explorer.js"></script>
<script src="js/zoom-imagem.js"></script>
<script src="js/tabs/tab-personagens.js"></script>
<script src="js/tabs/tab-organizacoes.js"></script>
<script src="js/tabs/tab-usuarios.js"></script>
<script src="js/editor-texto.js"></script>
<script src="js/tabs/tab-anotacoes.js"></script>
<script src="js/mesa-sync.js"></script>
<script src="js/tabs/tab-inicio.js"></script>
<!-- Inicialização (depois de todas as abas) -->
<script src="js/app.js"></script>
<!-- Mesa de Combate e escolha de usuário -->
<script src="js/mesa-frame.js"></script>
<script src="js/gate.js"></script>
</body>
</html>
